# ─────────────────────────────────────────────────────────────────────────────
# Shared network — all services communicate here
# ─────────────────────────────────────────────────────────────────────────────
networks:
  insurance-net:
    driver: bridge


# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — data survives container restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  memgraph-data:
  kafka-data:
  request-attachments:
  # Audit signing (Stage 2). Four separate volumes so each trust boundary is explicit:
  audit-keys:         # encrypted Ed25519 private keys: mounted ONLY into audit-signer
  audit-secrets:      # the key passphrase: mounted only into audit-signer (read-only) and the one-off init job
  audit-signer-state: # the signer's own trusted record of the last checkpoint per chain: audit-signer only
  audit-checkpoints:  # signed checkpoint files + the trusted key registry: audit-signer writes, audit-service reads (read-only)
  # Audit archive (Stage 3)
  aistor-data:          # the cold-storage objects (encrypted audit archives) on MinIO AIStor Free; survives container recreation
  audit-archive-keys:   # the archive master key (KEK): mounted READ-ONLY into audit-service; written only by the one-off init job
  audit-archive-work:   # scratch space for building archives (bounded, deleted after each job)

    # ─────────────────────────────────────────────────────────────────────────────
    # Re-usable FastAPI service defaults
    # ─────────────────────────────────────────────────────────────────────────────
x-fastapi-defaults: &fastapi-defaults
  restart: unless-stopped
  networks:
    - insurance-net
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    # macOS Docker Desktop doesn't forward FSEvents as inotify, so uvicorn --reload
    # would never detect file changes without forcing watchfiles to use polling.
    WATCHFILES_FORCE_POLLING: "true"

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Databases
  # ───────────────────────────────────────────────────────────────────────────
  # Postgres runs externally (native install on the host) — see .env DATABASE_URL.
  # Containers reach it via host.docker.internal.

  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: insurance-memgraph
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "7688:7687" # Bolt protocol
      - "7445:7444" # Memgraph Lab UI
      - "3001:3000" # Memgraph Lab web UI (mapped to 3001 to avoid conflict with frontend/host node)
    volumes:
      - memgraph-data:/var/lib/memgraph
    environment:
      MEMGRAPH_TELEMETRY_ENABLED: "false"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7687" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Backend microservices
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # Kafka (KRaft — no Zookeeper)
  # ───────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: insurance-kafka
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "9092:9092" # internal listener  (service → service)
      - "9094:9094" # external listener  (host tools, Postman Kafka plugins)
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Kafka UI — browse topics & messages at http://localhost:8090
  # ───────────────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: insurance-kafka-ui
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: insurance-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  api-gateway:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/api-gateway
      dockerfile: Dockerfile
    container_name: insurance-api-gateway
    # Browsers hold /events/stream (SSE) open indefinitely, so a --reload would
    # wait on them forever and hang the gateway; cap the graceful shutdown.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-graceful-shutdown", "5"]
    ports:
      - "8010:8000"
    volumes:
      - ./microservices/backend-microservices/api-gateway:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHAT_AGENT_URL: http://chat-agent:8006
      REQUEST_MANAGEMENT_SERVICE_URL: http://request-management-service:8007 # /request-management/* is proxied there
      CUSTOMER_MANAGEMENT_URL: http://customer-management:8009 # /customer-management/v1/* is proxied there
      AUDIT_SERVICE_URL: http://audit-service:8020 # /audit/v1/* is proxied there
    depends_on:
      kafka:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
      chat-agent:
        condition: service_healthy

  tenant-service:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/tenant-service
      dockerfile: Dockerfile
    container_name: insurance-tenant-service
    ports:
      - "8011:8001"
    volumes:
      - ./microservices/backend-microservices/tenant-service:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      DOCS_FORGERY_URL: ${DOCS_FORGERY_URL:-http://docs-forgery:8022}
      OCR_ENGINE_URL: http://ocr-engine:8004
      RISK_ENGINE_URL: http://risk-engine:8002
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true} # business changes are captured as audit intents (services/audit_capture.py)
      OPENSANCTIONS_API_KEY: ${OPENSANCTIONS_API_KEY}
      # Customer portal: provisioning hands accounts to Customer Management (PORTAL_PROVISIONING_MODE=legacy turns that off).
      CUSTOMER_MANAGEMENT_URL: http://customer-management:8009
      CUSTOMER_PORTAL_URL: ${CUSTOMER_PORTAL_URL:-http://localhost:3009/login}
      PORTAL_PROVISIONING_MODE: ${PORTAL_PROVISIONING_MODE:-dual}
      # Public origin of the pages customers open from emailed links (/e-application, /medical-exam).
      PORTAL_PUBLIC_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
      # Evaluation data lake (shared/evaluation): the `minio` service above, its own bucket and identity (created by minio-init).
      # No depends_on on purpose: the lake connects when first used, so tenant-service still starts without MinIO or its license.
      EVAL_LAKE_ENDPOINT: ${EVAL_LAKE_ENDPOINT:-http://minio:9000}
      EVAL_LAKE_ACCESS_KEY: ${EVAL_LAKE_ACCESS_KEY:-}
      EVAL_LAKE_SECRET_KEY: ${EVAL_LAKE_SECRET_KEY:-}
      EVAL_LAKE_BUCKET: ${EVAL_LAKE_BUCKET:-eval-lake}
      EVAL_LAKE_RETENTION_MODE: ${EVAL_LAKE_RETENTION_MODE:-GOVERNANCE}
      EVAL_LAKE_RETENTION_DAYS: ${EVAL_LAKE_RETENTION_DAYS:-365}
    depends_on:
      kafka:
        condition: service_healthy

  risk-engine:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/risk-engine
      dockerfile: Dockerfile
    container_name: insurance-risk-engine
    ports:
      - "8012:8002"
    volumes:
      - ./microservices/backend-microservices/risk-engine:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      memgraph:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8002/health'')"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # allow time for pip install on first cold start

  chat-agent:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/chat-agent
      dockerfile: Dockerfile
    container_name: insurance-chat-agent
    ports:
      - "8016:8006"
    volumes:
      - ./microservices/backend-microservices/chat-agent:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
      TENANT_SERVICE_URL: http://tenant-service:8001
      API_GATEWAY_URL: http://api-gateway:8000
      COMMISSION_SPECIALIST_ENABLED: ${COMMISSION_SPECIALIST_ENABLED:-true}
      GROUP_SPECIALIST_ENABLED: ${GROUP_SPECIALIST_ENABLED:-true}
      SERVICING_SPECIALIST_ENABLED: ${SERVICING_SPECIALIST_ENABLED:-true}
      UNDERWRITING_SPECIALIST_ENABLED: ${UNDERWRITING_SPECIALIST_ENABLED:-true}
      CLAIMS_SPECIALIST_ENABLED: ${CLAIMS_SPECIALIST_ENABLED:-true}
      # LLM provider keys/models come from the SuperAdmin config in
      # tenant-service (Platform → LLM Configuration), not env vars.
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8006/health'')"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # allow time for pip install on first cold start

  decision-engine:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/decision-engine
      dockerfile: Dockerfile
    container_name: insurance-decision-engine
    ports:
      - "8013:8003"
    volumes:
      - ./microservices/backend-microservices/decision-engine:/app

  ocr-engine:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/ocr-engine
      dockerfile: Dockerfile
    container_name: insurance-ocr-engine
    ports:
      - "8014:8004"
    volumes:
      - ./microservices/backend-microservices/ocr-engine:/app
      - ./shared/documents:/data # Required for the /extract-from-path endpoint

  docs-forgery:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/docs-forgery
      dockerfile: Dockerfile
    container_name: insurance-docs-forgery
    env_file:
      - path: .env.docs-forgery # Private to this service; no shared database-owner credentials
        required: false
    environment:
      DOCS_FORGERY_DATABASE_URL: ${DOCS_FORGERY_DATABASE_URL:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      TENANT_SERVICE_URL: http://tenant-service:8001
      WATCHFILES_FORCE_POLLING: "true"
      PIXEL_PYTHON: /opt/pixel-venv/bin/python
      TRUFOR_DIR: /opt/trufor
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8022", "--reload"]
    ports:
      - "127.0.0.1:8032:8022"
    volumes:
      - ./microservices/backend-microservices/docs-forgery:/app
    depends_on:
      tenant-service:
        condition: service_started # SuperAdmin policy and usage ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8022/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Explicit one-off DDL job. Owner credentials are never injected into the docs-forgery runtime.
  docs-forgery-provision:
    profiles: ["tools"]
    image: insurance-ai-docs-forgery
    restart: "no"
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file:
      - .env
      - path: .env.docs-forgery
        required: false
    volumes:
      - ./microservices/backend-microservices/docs-forgery:/app
    command: ["python", "scripts/provision_results.py"]

  # Legacy entrypoint linking to the authenticated Admin workspace.
  forgery-detection-app:
    build:
      context: ./microservices/frontend-microservices/forgery-detection-app
      dockerfile: Dockerfile
      target: dev
    container_name: insurance-forgery-detection-app
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3012:3012"
    volumes:
      - ./microservices/frontend-microservices/forgery-detection-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      PORTAL_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      docs-forgery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3012/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # khalid
  text-summarizer:
    <<: *fastapi-defaults
    build:
      context: ./microservices/backend-microservices/text-summarizer
      dockerfile: Dockerfile
    container_name: insurance-text-summarizer
    expose:
      - "8005"
    volumes:
      - ./microservices/backend-microservices/text-summarizer:/app

  # ───────────────────────────────────────────────────────────────────────────
  # Request Management — requests, routing, review decisions and approved-action execution.
  # Own schema (request_management) and least-privilege database role in the shared Postgres; see
  # services/request-management-service/README.md. First time only, create the roles and schema:
  #   docker compose --profile tools run --rm request-management-provision
  # ───────────────────────────────────────────────────────────────────────────
  request-management-service:
    <<: *fastapi-defaults
    build:
      context: . # repository root: the image also carries shared/ (event, signing and allowlist contracts)
      dockerfile: microservices/backend-microservices/request-management-service/Dockerfile
    container_name: insurance-request-management
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007", "--reload"]
    ports:
      - "8017:8007"
    volumes:
      - ./microservices/backend-microservices/request-management-service:/app
      - ./shared:/app/shared
      - request-attachments:/data/request-attachments # local attachment store when S3 isn't configured
    environment:
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
      # The service connects as the application role (rows in request_management only) ...
      REQUEST_MGMT_DATABASE_URL: postgresql+asyncpg://request_mgmt_app:${REQUEST_MGMT_DB_APP_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      # ... and migrates as the schema owner.
      REQUEST_MGMT_MIGRATION_DATABASE_URL: postgresql+asyncpg://request_mgmt_owner:${REQUEST_MGMT_DB_OWNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      TENANT_SERVICE_URL: http://tenant-service:8001
      REQUEST_MGMT_SERVICE_KEY: ${REQUEST_MGMT_SERVICE_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    depends_on:
      kafka:
        condition: service_healthy
      tenant-service:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8007/v1/healthz'')"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-off: create the request_management schema and its two database roles (needs Postgres admin credentials).
  request-management-provision:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: microservices/backend-microservices/request-management-service/Dockerfile
    networks:
      - insurance-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.provision"]
    environment:
      REQUEST_MGMT_PROVISION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      REQUEST_MGMT_DB_OWNER_PASSWORD: ${REQUEST_MGMT_DB_OWNER_PASSWORD:-}
      REQUEST_MGMT_DB_APP_PASSWORD: ${REQUEST_MGMT_DB_APP_PASSWORD:-}

  # ───────────────────────────────────────────────────────────────────────────
  # Customer Management — the individual customer portal's back end (services/customer-management)
  # Schema customer_management in the shared Postgres, least-privilege roles, signed calls to tenant-service.
  # Public API (via the gateway): /customer-management/v1/...  ·  Direct (dev): http://localhost:8019/v1/healthz
  # ───────────────────────────────────────────────────────────────────────────
  # Creates the customer_management schema and its two database roles, then exits. Safe to repeat.
  customer-management-provision:
    build:
      context: .
      dockerfile: microservices/backend-microservices/customer-management/Dockerfile
    restart: "no"
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [.env]
    command: ["python", "-m", "app.provision"]
    environment:
      CM_PROVISION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}

  customer-management:
    <<: *fastapi-defaults
    build:
      context: .
      dockerfile: microservices/backend-microservices/customer-management/Dockerfile
    container_name: insurance-customer-management
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8009", "--reload"]
    ports:
      - "8019:8009"
    volumes:
      - ./microservices/backend-microservices/customer-management:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
      CM_DATABASE_URL: postgresql+asyncpg://customer_management_app:${CM_DB_APP_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      CM_MIGRATION_DATABASE_URL: postgresql+asyncpg://customer_management_owner:${CM_DB_OWNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      TENANT_SERVICE_URL: http://tenant-service:8001
      CM_WALKIN_TENANT_CODE: ${CM_WALKIN_TENANT_CODE:-}
      CS_PORTAL_KEY: ${CS_PORTAL_KEY:-}
      CUSTOMER_SERVICE_URL: http://customer-service:8008
      ENV_VAR: ${ENV_VAR:-}   # demo: walk-ins skip the email code
      CM_WALKIN_DEV_OTP: ${CM_WALKIN_DEV_OTP:-}   # development only; ignored when CM_ENV=production
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092 # audit intents are relayed to the Audit Service over Kafka
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    depends_on:
      tenant-service:
        condition: service_started
      customer-management-provision:
        condition: service_completed_successfully # schema and roles exist before migrations run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/v1/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ───────────────────────────────────────────────────────────────────────────
  # Audit Service — the centralized, tenant-isolated, SHA-256 hash-chained audit ledger
  # Schema `audit` in the shared Postgres; the app role can read and append, never UPDATE or DELETE.
  # Events arrive from the services' transactional outboxes over Kafka (insurance.audit.events.v1).
  # Public API (via the gateway): /audit/v1/...  ·  Direct (dev): http://localhost:8030/v1/healthz
  # ───────────────────────────────────────────────────────────────────────────
  # Creates the audit schema and its two database roles, then exits. Safe to repeat.
  audit-provision:
    build:
      context: .
      dockerfile: microservices/backend-microservices/audit-service/Dockerfile
    restart: "no"
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [.env]
    command: ["python", "-m", "app.provision"]
    environment:
      AUDIT_PROVISION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD:-}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD:-}
      AUDIT_DB_SIGNER_PASSWORD: ${AUDIT_DB_SIGNER_PASSWORD:-}

  audit-service:
    <<: *fastapi-defaults
    build:
      context: .
      dockerfile: microservices/backend-microservices/audit-service/Dockerfile
    container_name: insurance-audit-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8020", "--reload"]
    ports:
      - "8030:8020"
    volumes:
      - ./microservices/backend-microservices/audit-service:/app
      - ./shared:/app/shared
      - audit-checkpoints:/var/lib/audit-checkpoints:ro
      - audit-archive-keys:/run/audit-archive-keys:ro
      - audit-archive-work:/var/lib/audit-archive-work
    environment:
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
      AUDIT_DATABASE_URL: postgresql+asyncpg://audit_app:${AUDIT_DB_APP_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      AUDIT_MIGRATION_DATABASE_URL: postgresql+asyncpg://audit_owner:${AUDIT_DB_OWNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      TENANT_SERVICE_URL: http://tenant-service:8001
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_CONSUMER_ENABLED: ${AUDIT_CONSUMER_ENABLED:-true}
      AUDIT_VERIFY_ENABLED: ${AUDIT_VERIFY_ENABLED:-true}
      AUDIT_VERIFY_INTERVAL_SECONDS: ${AUDIT_VERIFY_INTERVAL_SECONDS:-21600}
      AUDIT_READ_ROLES: ${AUDIT_READ_ROLES:-SuperAdmin}
      # Stage 2: signed checkpoints. The Audit Service never holds a private key; it asks audit-signer, and reads the
      # protected checkpoint store READ-ONLY.
      AUDIT_SIGNING_ENABLED: ${AUDIT_SIGNING_ENABLED:-true}
      AUDIT_SIGNING_PROVIDER: ${AUDIT_SIGNING_PROVIDER:-local}
      AUDIT_SIGNER_URL: http://audit-signer:8021
      AUDIT_SIGNER_SERVICE_KEY: ${AUDIT_SIGNER_SERVICE_KEY:-}
      AUDIT_CHECKPOINT_EVENT_THRESHOLD: ${AUDIT_CHECKPOINT_EVENT_THRESHOLD:-500}
      AUDIT_CHECKPOINT_INTERVAL_SECONDS: ${AUDIT_CHECKPOINT_INTERVAL_SECONDS:-900}
      AUDIT_CHECKPOINT_DIRECTORY: /var/lib/audit-checkpoints
      AUDIT_ENVIRONMENT_LABEL: ${AUDIT_ENVIRONMENT_LABEL:-local-dev}
      AUDIT_TRUST_ANCHOR_FINGERPRINT: ${AUDIT_TRUST_ANCHOR_FINGERPRINT:-}
      # Stage 3: archive and retention. MinIO identities are least-privilege (writer: no delete; reader: read-only); the root account is not here.
      AUDIT_ARCHIVING_ENABLED: ${AUDIT_ARCHIVING_ENABLED:-true}
      AUDIT_HOT_RETENTION_MONTHS: ${AUDIT_HOT_RETENTION_MONTHS:-6}
      AUDIT_ARCHIVE_SCHEDULE: ${AUDIT_ARCHIVE_SCHEDULE:-monthly}
      AUDIT_ARCHIVE_COMPRESSION: ${AUDIT_ARCHIVE_COMPRESSION:-zstd}
      AUDIT_ARCHIVE_STORAGE_PROVIDER: ${AUDIT_ARCHIVE_STORAGE_PROVIDER:-minio}
      AUDIT_AUTO_HOT_CLEANUP: ${AUDIT_AUTO_HOT_CLEANUP:-false}
      AUDIT_ARCHIVE_S3_ENDPOINT: ${AUDIT_ARCHIVE_S3_ENDPOINT:-http://minio:9000}
      AUDIT_ARCHIVE_BUCKET: ${AUDIT_ARCHIVE_BUCKET:-insurance-audit-archive}
      AUDIT_ARCHIVE_WRITER_KEY: ${AUDIT_ARCHIVE_WRITER_KEY:-}
      AUDIT_ARCHIVE_WRITER_SECRET: ${AUDIT_ARCHIVE_WRITER_SECRET:-}
      AUDIT_ARCHIVE_READER_KEY: ${AUDIT_ARCHIVE_READER_KEY:-}
      AUDIT_ARCHIVE_READER_SECRET: ${AUDIT_ARCHIVE_READER_SECRET:-}
      AUDIT_ARCHIVE_KEY_DIRECTORY: /run/audit-archive-keys
      AUDIT_ARCHIVE_WORK_DIRECTORY: /var/lib/audit-archive-work
      AUDIT_ARCHIVE_LOCK_MODE: ${AUDIT_ARCHIVE_LOCK_MODE:-GOVERNANCE}
      AUDIT_ARCHIVE_LOCK_DAYS: ${AUDIT_ARCHIVE_LOCK_DAYS:-30}
      AUDIT_ARCHIVE_INTERVAL_SECONDS: ${AUDIT_ARCHIVE_INTERVAL_SECONDS:-300}
      AUDIT_CLEANUP_MODE: ${AUDIT_CLEANUP_MODE:-detach}
      AUDIT_CLEANUP_SAFETY_DAYS: ${AUDIT_CLEANUP_SAFETY_DAYS:-7}
      # Development only (refused unless AUDIT_ENVIRONMENT_LABEL=local-dev): archive anything older than N seconds instead of the month window.
      AUDIT_ARCHIVE_TEST_MODE: ${AUDIT_ARCHIVE_TEST_MODE:-false}
      AUDIT_ARCHIVE_TEST_HOT_SECONDS: ${AUDIT_ARCHIVE_TEST_HOT_SECONDS:-120}
    depends_on:
      kafka:
        condition: service_healthy
      tenant-service:
        condition: service_started
      audit-provision:
        condition: service_completed_successfully # schema and roles exist before migrations run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/v1/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── MinIO AIStor Free: cold storage for archived audit events (Stage 3) ──────────────────────────────────
  # Single-node AIStor Free, pinned to an exact release. It needs a FREE LICENSE FILE that stays outside the repository: download it from
  # MinIO and set AISTOR_LICENSE_KEY in .env, or mount a real file via AISTOR_LICENSE_FILE. Started by the default Compose command. Without a license the
  # container refuses to start with an explanatory message. Reachable only from the Docker network and from localhost (ports bound to
  # 127.0.0.1). The bucket is private, versioned and Object-Lock-enabled; the application uses separate writer and reader identities.
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: insurance-minio
    restart: unless-stopped
    networks: [insurance-net]
    # The wrapper materializes an env license key inside the container; file mode also remains available.
    entrypoint: ["/bin/sh", "/init/start.sh"]
    environment:
      AISTOR_LICENSE_KEY: ${AISTOR_LICENSE_KEY:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (host tools)
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - aistor-data:/data
      - ./infrastructure/minio/start.sh:/init/start.sh:ro
      - type: bind
        source: ${AISTOR_LICENSE_FILE:-./infrastructure/minio/license-empty}
        target: /run/license/minio.license
        read_only: true
        bind:
          create_host_path: false # a typo must not create a directory instead of a license file
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-off, idempotent: creates the private versioned Object-Lock bucket and the least-privilege identities (writer: put/get/list,
  # NO delete; reader: get/list). Uses the root credentials, which no other service ever receives.
  minio-init:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: "no"
    networks: [insurance-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ENDPOINT: ${AUDIT_ARCHIVE_S3_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      AUDIT_ARCHIVE_BUCKET: ${AUDIT_ARCHIVE_BUCKET:-insurance-audit-archive}
      AUDIT_ARCHIVE_WRITER_KEY: ${AUDIT_ARCHIVE_WRITER_KEY:-}
      AUDIT_ARCHIVE_WRITER_SECRET: ${AUDIT_ARCHIVE_WRITER_SECRET:-}
      AUDIT_ARCHIVE_READER_KEY: ${AUDIT_ARCHIVE_READER_KEY:-}
      AUDIT_ARCHIVE_READER_SECRET: ${AUDIT_ARCHIVE_READER_SECRET:-}
      # Evaluation data lake bucket and identity (optional; skipped when EVAL_LAKE_ACCESS_KEY is empty).
      EVAL_LAKE_BUCKET: ${EVAL_LAKE_BUCKET:-eval-lake}
      EVAL_LAKE_ACCESS_KEY: ${EVAL_LAKE_ACCESS_KEY:-}
      EVAL_LAKE_SECRET_KEY: ${EVAL_LAKE_SECRET_KEY:-}
    volumes:
      - ./infrastructure/minio/init.sh:/init/init.sh:ro

  # One-off, explicit: creates the archive master key for THIS installation (never on an ordinary start; refuses to run twice).
  audit-archive-init:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: microservices/backend-microservices/audit-service/Dockerfile
    restart: "no"
    command: ["python", "-m", "app.archive.cli", "init-keys"]
    environment:
      AUDIT_ARCHIVE_KEY_DIRECTORY: /run/audit-archive-keys
    volumes:
      - audit-archive-keys:/run/audit-archive-keys

  # ── Audit checkpoint signer (Stage 2) ─────────────────────────────────────────────────────────────────────
  # The ONLY service that holds a private key. It has no published port, does not read the application's .env, runs as an
  # unprivileged user on a read-only filesystem, reads the ledger with a read-only database role, and accepts requests only
  # from the Audit Service (HMAC-signed). First-time setup: `docker compose run --rm audit-signer-init` (see audit-service/README.md).
  audit-signer:
    build:
      context: .
      dockerfile: microservices/backend-microservices/audit-signer/Dockerfile
    container_name: insurance-audit-signer
    restart: unless-stopped
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AUDIT_SIGNER_DATABASE_URL: postgresql+asyncpg://audit_signer:${AUDIT_DB_SIGNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      AUDIT_SIGNER_SERVICE_KEY: ${AUDIT_SIGNER_SERVICE_KEY:-}
      AUDIT_SIGNER_ID: ${AUDIT_SIGNER_ID:-audit-signer-local}
      AUDIT_KEY_DIRECTORY: /run/audit-keys
      AUDIT_KEY_PASSPHRASE_FILE: /run/audit-secrets/key-passphrase
      AUDIT_CHECKPOINT_DIRECTORY: /var/lib/audit-checkpoints
      AUDIT_SIGNER_STATE_DIRECTORY: /var/lib/audit-signer
      AUDIT_CHECKPOINT_MAX_EVENTS: ${AUDIT_CHECKPOINT_MAX_EVENTS:-5000}
      AUDIT_TRUST_ANCHOR_FINGERPRINT: ${AUDIT_TRUST_ANCHOR_FINGERPRINT:-}
    volumes:
      - audit-keys:/run/audit-keys
      - audit-secrets:/run/audit-secrets:ro
      - audit-signer-state:/var/lib/audit-signer
      - audit-checkpoints:/var/lib/audit-checkpoints
    depends_on:
      audit-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-off, explicit key initialisation for THIS installation: creates the Ed25519 key pair + trust root once, and refuses
  # to run again. Keys are never generated by an ordinary container start.
  audit-signer-init:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: microservices/backend-microservices/audit-signer/Dockerfile
    restart: "no"
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["python", "-m", "shared.audit.signer.cli", "init"]
    environment:
      AUDIT_SIGNER_DATABASE_URL: postgresql+asyncpg://audit_signer:${AUDIT_DB_SIGNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      AUDIT_SIGNER_ID: ${AUDIT_SIGNER_ID:-audit-signer-local}
      AUDIT_KEY_DIRECTORY: /run/audit-keys
      AUDIT_KEY_PASSPHRASE_FILE: /run/audit-secrets/key-passphrase
      AUDIT_CHECKPOINT_DIRECTORY: /var/lib/audit-checkpoints
      AUDIT_SIGNER_STATE_DIRECTORY: /var/lib/audit-signer
    volumes:
      - audit-keys:/run/audit-keys
      - audit-secrets:/run/audit-secrets
      - audit-signer-state:/var/lib/audit-signer
      - audit-checkpoints:/var/lib/audit-checkpoints

  # Customer portal (individual policyholders) — http://localhost:3009
  # Self-contained Next.js app (it imports nothing from the staff app). The browser talks only to this app; it holds the
  # session in httpOnly cookies and calls Customer Management through the API gateway, server-to-server.
  customer-portal:
    build:
      context: ./microservices/frontend-microservices/customer-portal
      dockerfile: Dockerfile
      target: dev
    container_name: insurance-customer-portal
    restart: unless-stopped
    networks: [insurance-net]
    ports:
      - "3009:3009"
    volumes:
      - ./microservices/frontend-microservices/customer-portal:/workspace/customer-portal
      - /workspace/customer-portal/node_modules
      - /workspace/customer-portal/.next
    environment:
      CM_STREAM_URL: http://customer-management:8009   # live updates connect straight to Customer Management (the gateway buffers responses)
      CM_API_URL: http://api-gateway:8000/customer-management
      COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false} # set to true behind HTTPS
      WATCHPACK_POLLING: "true"
    depends_on: [api-gateway, customer-management]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3009/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  customer-service:
    <<: *fastapi-defaults
    build:
      context: . # repository root: the image also carries shared/audit (audit event contract and outbox helpers)
      dockerfile: microservices/backend-microservices/customer-service/Dockerfile
    ports:
      - "8018:8008"
    volumes:
      - ./microservices/backend-microservices/customer-service:/app
      - ./shared:/app/shared
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092 # audit intents are relayed to the Audit Service over Kafka
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      CS_DATABASE_URL: postgresql+asyncpg://customer_service_app:${CS_DB_APP_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      CS_MIGRATION_DATABASE_URL: postgresql+asyncpg://customer_service_owner:${CS_DB_OWNER_PASSWORD:-unset}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      TENANT_SERVICE_URL: http://tenant-service:8001
      CS_PORTAL_KEY: ${CS_PORTAL_KEY:-}
      CS_OPEN_DESK: ${CS_OPEN_DESK:-}
      CS_OPEN_DESK_TENANT_ID: ${CS_OPEN_DESK_TENANT_ID:-}
      CS_ENV: ${CS_ENV:-development}
    depends_on:
      tenant-service:
        condition: service_started
      customer-service-provision:
        condition: service_completed_successfully # schema and users exist before migrations run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/v1/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Creates the customer_service schema and its two database users in the existing database, then exits. Runs on
  # every `docker compose up` (it is safe to repeat) and customer-service waits for it to finish.
  customer-service-provision:
    build:
      context: .
      dockerfile: microservices/backend-microservices/customer-service/Dockerfile
    restart: "no"
    networks: [insurance-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [.env]
    command: ["python", "provision.py"]
    environment:
      CS_PROVISION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-}@host.docker.internal:5432/${POSTGRES_DB:-insurance-ai}
      CS_DB_OWNER_PASSWORD: ${CS_DB_OWNER_PASSWORD:-69d600fc74731edaf89834f7bebce346}
      CS_DB_APP_PASSWORD: ${CS_DB_APP_PASSWORD:-5a511f3af5bb1c398d10b628d70bfef4}

  customer-service-app:
    build:
      context: ./microservices/frontend-microservices # holds this app and the portal code it shares (frontend/app/services, components, lib)
      dockerfile: customer-service-app/Dockerfile
      target: dev
    restart: unless-stopped
    networks: [insurance-net]
    ports:
      - "3008:3008"
    volumes:
      - ./microservices/frontend-microservices/customer-service-app:/workspace/customer-service-app
      - ./microservices/frontend-microservices/frontend/components:/workspace/frontend/components
      - ./microservices/frontend-microservices/frontend/lib:/workspace/frontend/lib
      - ./microservices/frontend-microservices/frontend/app/services:/workspace/frontend/app/services
      - ./microservices/frontend-microservices/frontend/app/globals.css:/workspace/frontend/app/globals.css
      - /workspace/customer-service-app/node_modules
      - /workspace/customer-service-app/.next
    environment:
      ENV_VAR: ${ENV_VAR:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: ${NEXT_PUBLIC_CUSTOMER_SERVICE_URL:-http://localhost:3008}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
      WATCHPACK_POLLING: "true"
    depends_on: [api-gateway, customer-service]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # The same desk app as above, deployed WITHOUT a sign-in: http://localhost:3010. For the service team in development; it acts as one
  # fixed tenant and the service refuses it when CS_ENV=production. Admins use the signed-in desk (3008) to view tickets.
  customer-service-desk:
    build:
      context: ./microservices/frontend-microservices # holds this app and the portal code it shares (frontend/app/services, components, lib)
      dockerfile: customer-service-app/Dockerfile
      target: dev
    restart: unless-stopped
    networks: [insurance-net]
    ports:
      - "3010:3008"
    volumes:
      - ./microservices/frontend-microservices/customer-service-app:/workspace/customer-service-app
      - ./microservices/frontend-microservices/frontend/components:/workspace/frontend/components
      - ./microservices/frontend-microservices/frontend/lib:/workspace/frontend/lib
      - ./microservices/frontend-microservices/frontend/app/services:/workspace/frontend/app/services
      - ./microservices/frontend-microservices/frontend/app/globals.css:/workspace/frontend/app/globals.css
      - /workspace/customer-service-app/node_modules
      - /workspace/customer-service-app/.next
    environment:
      ENV_VAR: ${ENV_VAR:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: http://localhost:3010
      NEXT_PUBLIC_OPEN_DESK: "true"
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
      WATCHPACK_POLLING: "true"
    depends_on: [api-gateway, customer-service]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ───────────────────────────────────────────────────────────────────────────
  # Docs (Docusaurus) — http://localhost:4991
  # ───────────────────────────────────────────────────────────────────────────
  docs:
    image: node:20-alpine
    container_name: insurance-docs
    restart: unless-stopped
    working_dir: /app
    networks:
      - insurance-net
    ports:
      - "4991:4991"
    volumes:
      - ./microservices/frontend-microservices/docs:/app
      - /app/node_modules # prevent host node_modules from being used inside container
    command: sh -c "npm install && npm start"

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend (Next.js App Router)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./microservices/frontend-microservices/frontend
      dockerfile: Dockerfile
      target: dev # use the dev stage for hot-reload during development
    container_name: insurance-frontend
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./microservices/frontend-microservices/frontend:/app # hot-reload source files
      - /app/node_modules # prevent host node_modules from overwriting container's
      - /app/.next # preserve Next.js build cache between restarts
    environment:
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: ${NEXT_PUBLIC_CUSTOMER_SERVICE_URL:-http://localhost:3008}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010} # browser-side; host port that maps to gateway container port 8000
      NEXT_PUBLIC_OCR_URL: ${NEXT_PUBLIC_OCR_URL:-http://localhost:8014} # browser-side; host port mapping to ocr-engine
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000 # server-side (Next.js API routes); internal docker network
      CHOKIDAR_USEPOLLING: "true" # macOS Docker Desktop: FSEvents don't reach chokidar via inotify
      NEXT_PUBLIC_AUTOMATION_URL: ${NEXT_PUBLIC_AUTOMATION_URL:-http://localhost:3004} # the Automation Chat app (the "Automation" button opens it)
      NEXT_PUBLIC_UNDERWRITING_URL: ${NEXT_PUBLIC_UNDERWRITING_URL:-http://localhost:3005} # the Underwriting Workbench: underwriting links and old-URL redirects go there
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000} # this app's own public URL (trusted sign-in return, redirect-loop guard)
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso} # single sign-on cookie shared with the Automation Chat and Underwriting Workbench
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-} # empty on localhost; a shared parent domain (.example.com) across subdomains

  # ───────────────────────────────────────────────────────────────────────────
  # Automation Chat (Next.js) — the AI copilot as its own app, http://localhost:3004
  # Signs in from the dashboard's session (single sign-on cookie), see automation-chat/README.md
  # ───────────────────────────────────────────────────────────────────────────
  automation-chat:
    build:
      context: ./microservices/frontend-microservices/automation-chat
      dockerfile: Dockerfile
      target: dev
    container_name: insurance-automation-chat
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3004:3000"
    env_file:
      - .env
      - ./microservices/frontend-microservices/frontend/.env.local # voice keys (STT/TTS) live with the dashboard's local env
    volumes:
      - ./microservices/frontend-microservices/automation-chat:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_OCR_URL: ${NEXT_PUBLIC_OCR_URL:-http://localhost:8014}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000} # the dashboard: embedded pages and the sign-in redirect
      NEXT_PUBLIC_UNDERWRITING_URL: ${NEXT_PUBLIC_UNDERWRITING_URL:-http://localhost:3005} # case views and other underwriting pages it opens or embeds
      NEXT_PUBLIC_CLAIMS_URL: ${NEXT_PUBLIC_CLAIMS_URL:-http://localhost:3011} # the Claims Manager app, which hosts the Copilot window
      NEXT_PUBLIC_CUSTOMER_SERVICE_URL: ${NEXT_PUBLIC_CUSTOMER_SERVICE_URL:-http://localhost:3008}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api-gateway

  # ───────────────────────────────────────────────────────────────────────────
  # Underwriting Workbench (Next.js) — the underwriting queue and case workspace as their own app,
  # http://localhost:3005. Signs in from the portal's session (single sign-on cookie); see underwriting-app/README.md.
  # Start it with just its backend:   docker compose up -d --build underwriting-app
  # (pulls in api-gateway and tenant-service; sign-in still happens on the portal: add `frontend` if it isn't running)
  # ───────────────────────────────────────────────────────────────────────────
  underwriting-app:
    build:
      context: ./microservices/frontend-microservices # holds this app and the portal code it shares (frontend/app/services, components, lib)
      dockerfile: underwriting-app/Dockerfile
      target: dev
    container_name: insurance-underwriting-app
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3005:3005"
    volumes:
      - ./microservices/frontend-microservices/underwriting-app:/repo/underwriting-app # hot-reload source files
      - /repo/underwriting-app/node_modules # keep the container's node_modules
      - /repo/underwriting-app/.next # preserve the build cache between restarts
      # The portal code the workbench shares, read-only, so edits to it reload here too.
      - ./microservices/frontend-microservices/frontend/app/services:/repo/frontend/app/services:ro
      - ./microservices/frontend-microservices/frontend/app/globals.css:/repo/frontend/app/globals.css:ro
      - ./microservices/frontend-microservices/frontend/components:/repo/frontend/components:ro
      - ./microservices/frontend-microservices/frontend/lib:/repo/frontend/lib:ro
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010} # browser-side API gateway
      NEXT_PUBLIC_OCR_URL: ${NEXT_PUBLIC_OCR_URL:-http://localhost:8014}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000} # sign-in, "Back to the portal", portal pages
      NEXT_PUBLIC_UNDERWRITING_URL: ${NEXT_PUBLIC_UNDERWRITING_URL:-http://localhost:3005} # this app's own public URL
      NEXT_PUBLIC_AUTOMATION_URL: ${NEXT_PUBLIC_AUTOMATION_URL:-http://localhost:3004} # the chat that embeds case views
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000 # server-side: session check and the live-event stream
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
      ENV_VAR: ${ENV_VAR:-}
      CHOKIDAR_USEPOLLING: "true" # macOS Docker Desktop: file events don't reach the container
      WATCHPACK_POLLING: "true"
    depends_on:
      - api-gateway
      - tenant-service
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s # first compile in dev

  # Claims Manager portal (Next.js) — approvals, workload, risk flags and settlement oversight for claims managers,
  # http://localhost:3011. Signs in from the portal's session (single sign-on cookie), like the Underwriting Workbench.
  # Start it with:   docker compose up -d --build claims-manager-app
  # ───────────────────────────────────────────────────────────────────────────
  claims-manager-app:
    build:
      context: ./microservices/frontend-microservices # holds this app and the portal code it shares (frontend/app/services, components, lib)
      dockerfile: claims-manager-app/Dockerfile
      target: dev
    container_name: insurance-claims-manager-app
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3011:3011"
    volumes:
      - ./microservices/frontend-microservices/claims-manager-app:/repo/claims-manager-app # hot-reload source files
      - /repo/claims-manager-app/node_modules # keep the container's node_modules
      - /repo/claims-manager-app/.next # preserve the build cache between restarts
      - ./microservices/frontend-microservices/frontend/app/services:/repo/frontend/app/services:ro
      - ./microservices/frontend-microservices/frontend/app/claims:/repo/frontend/app/claims:ro # the claims pages, shared with the main portal
      - ./microservices/frontend-microservices/frontend/app/globals.css:/repo/frontend/app/globals.css:ro
      - ./microservices/frontend-microservices/frontend/components:/repo/frontend/components:ro
      - ./microservices/frontend-microservices/frontend/lib:/repo/frontend/lib:ro
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010} # browser-side API gateway
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000} # sign-in, "Back to the portal"
      NEXT_PUBLIC_CLAIMS_URL: ${NEXT_PUBLIC_CLAIMS_URL:-http://localhost:3011} # this app's own public URL
      NEXT_PUBLIC_UNDERWRITING_URL: ${NEXT_PUBLIC_UNDERWRITING_URL:-http://localhost:3005}
      NEXT_PUBLIC_AUTOMATION_URL: ${NEXT_PUBLIC_AUTOMATION_URL:-http://localhost:3004}
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000 # server-side: the session check
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      CLAIMS_COOKIE_NAME: ${CLAIMS_COOKIE_NAME:-claims_manager_session}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
      ENV_VAR: ${ENV_VAR:-}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - api-gateway
      - tenant-service
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3011/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s # first compile in dev

  # Production build of the workbench, for measuring real speed (the dev service compiles pages on first visit and
  # runs unminified React). Runs beside the dev service:
  #   docker compose --profile prod up --build -d underwriting-app-prod   ->  http://localhost:3006
  underwriting-app-prod:
    profiles: ["prod"]
    build:
      context: ./microservices/frontend-microservices # holds this app and the portal code it shares (frontend/app/services, components, lib)
      dockerfile: underwriting-app/Dockerfile
      target: runner
      args: # compiled into the browser bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_OCR_URL: ${NEXT_PUBLIC_OCR_URL:-http://localhost:8014}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
        NEXT_PUBLIC_UNDERWRITING_URL: ${UNDERWRITING_PROD_URL:-http://localhost:3006}
        NEXT_PUBLIC_AUTOMATION_URL: ${NEXT_PUBLIC_AUTOMATION_URL:-http://localhost:3004}
        ENV_VAR: ${ENV_VAR:-}
    container_name: insurance-underwriting-app-prod
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3006:3005"
    environment:
      API_GATEWAY_INTERNAL_URL: http://api-gateway:8000
      SSO_COOKIE_NAME: ${SSO_COOKIE_NAME:-insurance_sso}
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
    depends_on:
      - api-gateway
      - tenant-service
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3005/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # Marketing site (Next.js App Router) — public site at http://localhost:3002
  # ───────────────────────────────────────────────────────────────────────────
  marketing-site:
    build:
      context: ./microservices/frontend-microservices/marketing-site
      dockerfile: Dockerfile
      target: dev
    container_name: insurance-marketing-site
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3002:3000"
    volumes:
      - ./microservices/frontend-microservices/marketing-site:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"

  # Production build of the marketing site for judging real speed (the dev service above runs
  # unminified React with hot reload, which is noticeably slower).
  #   docker compose --profile prod up --build -d marketing-site-prod   ->  http://localhost:3003
  marketing-site-prod:
    profiles: ["prod"]
    build:
      context: ./microservices/frontend-microservices/marketing-site
      dockerfile: Dockerfile
      target: runner
    container_name: insurance-marketing-site-prod
    restart: unless-stopped
    networks:
      - insurance-net
    ports:
      - "3003:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-http://localhost:3000}
